services:
  postgres:
    image: postgres:15-alpine
    container_name: recruitment-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/02-keycloak.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d newone"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated database for the API test suite. It must never share the `newone`
  # database used by local development or the application container.
  postgres-test:
    image: postgres:15-alpine
    container_name: recruitment-db-test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blinkfy_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d blinkfy_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: recruitment-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

  keycloak:
    # Keycloak Admin: admin / admin (change in production)
    image: quay.io/keycloak/keycloak:25.0
    container_name: recruitment-keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_SMTP_HOST: mailpit
      KC_SMTP_PORT: 1025
      KC_SMTP_FROM: noreply@recruitment.local
      KC_SMTP_FROM_DISPLAY_NAME: Recruitment Platform
    volumes:
      - ./keycloak/recruitment-realm.json:/opt/keycloak/data/import/recruitment-realm.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: recruitment-api
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/newone
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: recruitment
      KEYCLOAK_CLIENT_ID: recruitment-web
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: recruitment-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost/auth
      NEXT_PUBLIC_KEYCLOAK_REALM: recruitment
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: recruitment-web
    depends_on:
      - api
    restart: always

  nginx:
    image: nginx:alpine
    container_name: recruitment-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - keycloak
    restart: always

volumes:
  postgres_data:
  postgres_test_data:
