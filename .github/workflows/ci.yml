name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: blinkfy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d blinkfy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: test-only-jwt-secret-please-do-not-use-in-production
      TEST_DATABASE_URL: postgresql://admin:password@localhost:5432/blinkfy_test
      DATABASE_URL: postgresql://admin:password@localhost:5432/blinkfy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=apps/api -- prisma migrate deploy --schema prisma/schema.prisma
      - run: npm run test --workspace=apps/api
      - run: npm run test --workspace=apps/web
      - run: npm run build --workspace=apps/web
      - run: npm run build --workspace=packages/shared --if-present

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: blinkfy-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: blinkfy-web:ci
